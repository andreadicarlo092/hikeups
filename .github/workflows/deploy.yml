name: Build data and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

env:
  TIPPECANOE_REF: 4f2621186acfec33b63ddf636f665623c0fef2dd

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osmium-tool gdal-bin build-essential libsqlite3-dev zlib1g-dev

      - name: Cache tippecanoe
        id: tippecanoe-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/tippecanoe
          key: tippecanoe-${{ runner.os }}-${{ env.TIPPECANOE_REF }}

      - name: Build tippecanoe
        if: steps.tippecanoe-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          git -C /tmp/tippecanoe checkout "$TIPPECANOE_REF"
          make -C /tmp/tippecanoe -j"$(nproc)"
          make -C /tmp/tippecanoe install PREFIX="$HOME/.local/tippecanoe"

      - run: echo "$HOME/.local/tippecanoe/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: etl/requirements.txt

      - run: pip install -r etl/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - name: Download OSM extract and Copernicus DEM
        run: etl/download.sh

      - name: Run ETL
        working-directory: etl
        run: python build.py

      - run: web/scripts/sync-data.sh

      - name: Build static site
        working-directory: web
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: web/build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
